# OpenMRS FHIR proxy → Odoo FHIR facade (stock/price in order basket).
# Off unless EXTERNAL_FHIR_API_ENABLED=true (set when Odoo/fhir-odoo is running).
# ${ENV} placeholders are resolved by fhirproxy from the backend container environment.
external.api.enabled=${EXTERNAL_FHIR_API_ENABLED}
base.url=${EXTERNAL_FHIR_API_URL}
username=${EXTERNAL_FHIR_API_USERNAME}
password=${EXTERNAL_FHIR_API_PASSWORD}
