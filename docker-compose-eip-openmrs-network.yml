# Attach EIP and fhir-odoo to the OpenMRS compose network so hostnames `backend`,
# `db`, and `fhir-odoo` resolve (order-basket stock/price via fhirproxy).
# Usage (after OpenMRS is up):
#   docker compose -f docker-compose-odoo.yml -f docker-compose-odoo.local.yml -f docker-compose-eip-openmrs-network.yml --env-file .env up -d

services:
  eip-odoo-openmrs:
    networks:
      - default
      - openmrs
  fhir-odoo:
    networks:
      - default
      - openmrs

networks:
  openmrs:
    external: true
    name: o3-amrs_default
