# Local overrides: live-mount ampath_billing + initializer config.
# If initializer CSV fails with KeyError x_intervention_code on product.product, the billing
# addon is not installed in the DB yet — install once, then restart Odoo:
#   docker exec -e PGHOST=postgresql -e PGUSER=odoo -e PGPASSWORD=password \
#     <odoo-container> /opt/odoo/odoo-bin -c /etc/odoo/odoo.conf -d odoo -i ampath_billing --stop-after-init
services:
  odoo:
    environment:
      # Force include ampath_billing during local development.
      ADDONS: sale_management,stock,account,purchase,mrp,odoo_initializer,mrp_product_expiry,product_expiry,ampath_billing,l10n_ke
    volumes:
      # Live-edit: host tree overrides the image. If the path is wrong or empty, Odoo will not
      # see ampath_billing and you get "Unmet dependencies: ampath_billing" (initializer depends on it).
      - ./distro/binaries/odoo/addons/ampath_billing:/mnt/extra-addons/ampath_billing
      # Live-edit local initializer config files.
      - ./distro/config/odoo/initializer_config:/mnt/odoo_config
