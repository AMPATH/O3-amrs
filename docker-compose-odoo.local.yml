# Merge with: docker compose -f docker-compose-odoo.yml -f docker-compose-odoo.local.yml up -d
#
# Live-edit host trees into the Odoo container (ampath_billing + initializer CSVs).
#
# Remote (SSH) — use `sudo docker` on the host when needed:
#   ssh user@host 'sudo docker ps'
#   ssh user@host 'sudo docker logs o3-amrs-odoo-1 2>&1 | tail -80'
#
# If initializer CSV fails with KeyError x_intervention_code on product.product, install billing once:
#   docker compose -f docker-compose-odoo.yml -f docker-compose-odoo.local.yml exec odoo \
#     /opt/odoo/odoo-bin -c /etc/odoo/odoo.conf -d odoo -i ampath_billing --stop-after-init

services:
  odoo:
    volumes:
      - ./distro/binaries/odoo/addons/ampath_billing:/mnt/extra-addons/ampath_billing
      - ./distro/config/odoo/initializer_config:/mnt/odoo_config
