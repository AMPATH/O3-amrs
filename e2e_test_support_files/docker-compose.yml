services:
  gateway:
    image: gateway
    restart: "unless-stopped"
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"

  frontend:
    image: frontend
    restart: "unless-stopped"
    depends_on:
      - backend

  backend:
    image: backend
    restart: "unless-stopped"
    environment:
      # CVE-2026-114938 (Java4Shell). Interim until the Corretto image is patched.
      JAVA_TOOL_OPTIONS: "-XX:-UseBASE64Intrinsics"

  db:
    image: db
    restart: "unless-stopped"

